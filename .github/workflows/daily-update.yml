name: Daily Development Log

on:
  schedule:
    - cron: "30 4 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create daily log
        run: |
          mkdir -p logs
          DATE=$(date '+%Y-%m-%d')
          TIME=$(date '+%H:%M:%S')

          echo "# Development Log - $DATE" > "logs/$DATE.md"
          echo "" >> "logs/$DATE.md"
          echo "Daily project documentation update." >> "logs/$DATE.md"
          echo "Updated at: $TIME IST" >> "logs/$DATE.md"

      - name: Commit
        run: |
          git config user.name "Rounak-Lakhara"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "docs: daily development log"
          git push
